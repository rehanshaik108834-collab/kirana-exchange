[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kirana-swap-matcher"
version = "0.1.0"
description = "Min-cost bipartite swap matching worker using scipy.optimize.linear_sum_assignment"
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "aio-pika>=9.4.3",
    "structlog>=24.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
