[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kirana-analytics-simulator"
version = "0.1.0"
description = "Deterministic synthetic demand generator and benchmark data pipeline for Kirana Exchange"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.scripts]
simulator = "simulator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
