name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check (Prettier)
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,json,md,yml,yaml}"

      - name: Build Shared Common Library
        run: pnpm --filter @kirana/common build

      - name: Node Services Build & Unit Tests
        run: |
          pnpm --filter @kirana/api-gateway build
          pnpm --filter @kirana/api-gateway test
          pnpm --filter @kirana/inventory-service build
          pnpm --filter @kirana/inventory-service test
          pnpm --filter @kirana/swap-service build
          pnpm --filter @kirana/swap-service test
          pnpm --filter @kirana/web-app test

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python Lint (Ruff)
        run: |
          pip install ruff
          ruff check services-py/

      - name: Python Test Suite (Pytest)
        run: |
          pip install -r services-py/analytics-simulator/requirements.txt
          pytest services-py/analytics-simulator/tests -v
          pip install -r services-py/forecast-service/requirements.txt
          pytest services-py/forecast-service/tests -v
          pip install -r services-py/swap-matcher/requirements.txt
          pytest services-py/swap-matcher/tests -v
