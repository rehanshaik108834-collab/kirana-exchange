openapi: 3.1.0
info:
  title: Kirana Exchange - Inventory Service
  version: 1.0.0
servers:
  - url: http://localhost:3000/v1/inventory
paths:
  /batches/{batchId}/reserve:
    post:
      summary: Reserve stock for a swap saga
      operationId: reserveStock
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qty, version, shopId]
              properties:
                qty:
                  type: integer
                  minimum: 1
                version:
                  type: integer
                shopId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Stock reserved successfully
        '409':
          description: Conflict (Insufficient unreserved stock or version mismatch)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
